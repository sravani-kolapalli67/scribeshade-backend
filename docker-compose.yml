version: "3.9"

# ==============================================================================
# ScribeShade — Backend compose
#
# The "scribeshade-net" external network is shared with the frontend compose
# (~/scribeshade-web/docker-compose.yml) so the nginx proxy inside the web
# container can reach "scribeshade-api" by name on port 3200 without the
# backend needing an external domain.
#
# Create the network once on the server before first deploy:
#   docker network create scribeshade-net
# ==============================================================================

services:

  redis:
    image: redis:7-alpine
    container_name: scribeshade-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: scribeshade-db
    restart: always
    environment:
      POSTGRES_USER: scribe-user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: scribeshade
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    image: scribeshade-backend:latest
    container_name: scribeshade-api
    restart: always
    ports:
      # Keep the host port open for direct access / debugging.
      # The frontend nginx uses the internal Docker network instead.
      - "3200:3200"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://scribeshade-redis:6379
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      # Internal backend network (reaches redis, postgres by name)
      - internal
      # Shared network — makes "scribeshade-api" resolvable from the frontend
      # nginx container without exposing the backend to the public internet.
      - scribeshade-net

volumes:
  postgres_data:
  redis_data:

networks:
  # Backend-only network: redis and postgres are NOT on scribeshade-net
  # so they stay invisible to the frontend container.
  internal:
    driver: bridge

  # Shared external network: created once on the server, joined by both stacks.
  scribeshade-net:
    external: true
